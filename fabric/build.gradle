plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

// Datagen lives in its own source set (kept out of the release jar) and writes into common, so both
// loaders ship identical data. Regenerate with `./gradlew :fabric:runDatagen` and commit the result.
fabricApi {
    configureDataGeneration {
        createSourceSet = true
        modId = "${mod_id}_datagen"
        outputDirectory = project(':common').file('src/generated/resources')
        addToResources = false
        client = false
    }
}

// GameTests run as a separate mod from the gametest source set, which adds the shared tests from
// common. `./gradlew :fabric:runGameTest` runs them headless; `check` runs them too.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${mod_id}_gametest"
        enableGameTests = true
        enableClientGameTests = false
    }
}
sourceSets.gametest {
    java.srcDir(project(':common').file('src/gametest/java'))
    resources.srcDir(project(':common').file('src/gametest/resources'))
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            programArg('nogui')
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
