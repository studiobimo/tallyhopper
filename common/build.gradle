plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'jacoco'
}

// Common compiles against vanilla Minecraft only (via NeoForm), so nothing
// loader-specific can leak into shared code.
neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Fabric and NeoForge both bundle Mixin and MixinExtras, so common may use them.
    compileOnly(libs.mixin)
    compileOnly(libs.mixinextras.common)
    annotationProcessor(libs.mixinextras.common)

    testImplementation(platform(libs.junit.bom))
    testImplementation(libs.junit.jupiter)
    testImplementation(libs.assertj.core)
    testRuntimeOnly(libs.junit.platform.launcher)
}

// Unit tests cover pure, Minecraft-free logic. In-game behavior is covered by GameTests.
tasks.named('test', Test) {
    useJUnitPlatform()
    finalizedBy('jacocoTestReport')
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.named('jacocoTestReport', JacocoReport) {
    reports {
        xml.required = true
        html.required = true
    }
}

// Coverage gate for the offline-credit math, where bugs would silently mint or lose items.
tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['dev.bimo.tallyhopper.offline']
            limit {
                counter = 'LINE'
                minimum = 0.90
            }
        }
    }
}

tasks.named('check') {
    dependsOn('jacocoTestCoverageVerification')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// mcgradleconventions loader attribute, so loader projects pick the common variant.
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
