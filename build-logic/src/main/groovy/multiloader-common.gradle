// Conventions shared by every subproject (common, fabric, neoforge).
plugins {
    id 'java-library'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
}

// Precompiled script plugins cannot use the type-safe accessor, so look the catalog up by name.
def libs = versionCatalogs.named('libs')

base {
    archivesName = "${mod_id}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

dependencies {
    compileOnly(libs.findLibrary('jspecify').get())
    errorprone(libs.findLibrary('errorprone-core').get())
    errorprone(libs.findLibrary('nullaway').get())
}

// Pin every resolved dependency (gradle.lockfile per project). Regenerate with
// `make -C .devtools lock` after changing versions.
dependencyLocking {
    lockAllConfigurations()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
    options.compilerArgs.addAll(['-Xlint:all,-processing,-serial', '-Werror'])
    options.errorprone {
        disableWarningsInGeneratedCode = true
        excludedPaths = '.*/build/generated/.*'
        // Minecraft is not null-annotated; enforce nullness only in our packages.
        option('NullAway:AnnotatedPackages', 'dev.bimo.tallyhopper')
        option('NullAway:JSpecifyMode', 'true')
        error('NullAway')
    }
}

// Error Prone only on production code; tests favor readability over lint strictness.
tasks.named('compileTestJava', JavaCompile) {
    options.errorprone.enabled = false
    options.compilerArgs.remove('-Werror')
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat(libs.findVersion('palantir-java-format').get().requiredVersion)
        removeUnusedImports()
        formatAnnotations()
    }
}

// Reproducible archives: identical inputs produce byte-identical jars, which
// makes build provenance attestations meaningful.
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.version}+mc${minecraft_version}"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : project.version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'homepage'                     : homepage,
            'sources'                      : sources,
            'issues'                       : issues,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries { key, value ->
        [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

// Resolves every resolvable configuration so `--write-locks` captures all of them.
tasks.register('resolveAndLockAll') {
    group = 'dependency locking'
    description = 'Resolves all configurations; run with --write-locks to refresh gradle.lockfile.'
    notCompatibleWithConfigurationCache('Resolves configurations at execution time')
    doFirst {
        assert gradle.startParameter.writeDependencyLocks: 'Run with --write-locks'
    }
    doLast {
        configurations.findAll { it.canBeResolved }.each { it.resolve() }
    }
}
