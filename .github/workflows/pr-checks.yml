name: PR checks

# Thin wrapper. The checks live in studiobimo/.github so a fix lands in every
# repo at once; see that repo's README for the inputs.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-checks:
    # A called workflow can never hold more than its caller, so the caller has to
    # grant what it needs. `permissions: {}` above keeps every other job at nothing.
    permissions:
      contents: read
    uses: studiobimo/.github/.github/workflows/pr-checks.yml@d43075f0efd547785f4b56052e2982da88e5b3bf # refactor/actions-under-dot-github
    with:
      max-files: 20
