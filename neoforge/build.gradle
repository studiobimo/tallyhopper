plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

configurations {
    testMods
}

def installTestMods(run) {
    def install = tasks.register("install${run.name.capitalize()}TestMods", run.name == 'gameTestServer' ? Sync : Copy) {
        from(configurations.testMods)
        into(run.gameDirectory.dir('mods'))
    }
    run.taskBefore(install)
}

dependencies {
    testMods("maven.modrinth:storagedrawers:${storage_drawers_version}+neoforge")
}

sourceSets {
    gametest {
        java.srcDir(project(':common').file('src/gametest/java'))
        resources.srcDir(project(':common').file('src/gametest/resources'))
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.gametest)
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
            installTestMods(it)
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        server {
            server()
            programArgument('--nogui')
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            loadedMods = [mods."${mod_id}", mods."${mod_id}_gametest"]
            gameDirectory = this.mkdir(this.file('build/run/gameTest'))
        }
    }
}

tasks.named('check') {
    dependsOn('runGameTestServer')
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
