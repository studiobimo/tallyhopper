# Build tooling and test dependencies. Minecraft, Fabric and NeoForge runtime
# versions live in gradle.properties because they are templated into mod metadata.

[versions]
fabric-loom = "1.18.1"
neoforged-moddev = "2.0.148"
mixin = "0.17.3+mixin.0.8.7"
mixinextras = "0.5.3"
spotless = "8.10.3"
palantir-java-format = "2.98.0"
errorprone-plugin = "5.1.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
# Must match the version Minecraft bundles (strict constraint from minecraft-dependencies).
jspecify = "1.0.0"
junit = "6.1.3"
assertj = "3.27.7"
jacoco = "0.8.15"

[libraries]
mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }
mixinextras-common = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
neoforged-moddev = { id = "net.neoforged.moddev", version.ref = "neoforged-moddev" }
