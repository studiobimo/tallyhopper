# Every key used in resource templates must also be listed in the expandProps map
# in build-logic/src/main/groovy/multiloader-common.gradle.

# Project (version is managed by release-please; do not edit by hand)
# x-release-please-start-version
version=0.1.0
# x-release-please-end
group=dev.bimo
# Java version: see .java-version (single source of truth for Gradle, CI and version managers)

# Mod metadata
mod_id=tallyhopper
mod_name=Tally Hopper
mod_author=studiobimo
license=MIT
credits=
description=A hopper that measures your farm's output and credits it for the real-world time your world was closed.
homepage=https://github.com/studiobimo/tallyhopper
sources=https://github.com/studiobimo/tallyhopper
issues=https://github.com/studiobimo/tallyhopper/issues

# Minecraft platform versions. These are bumped deliberately per Minecraft
# release, not by Dependabot. https://projects.neoforged.net/neoforged/neoform
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
neo_form_version=26.3-1

# Fabric: https://fabricmc.net/develop/
fabric_version=0.160.6+26.3
fabric_loader_version=0.19.5

# NeoForge: https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.1-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true

# Third-party mods loaded only by the dev and GameTest runtimes, to prove credit reaches modded
# storage (M6). They are never a compile dependency and never ship in the jar.
# https://modrinth.com/mod/storagedrawers
storage_drawers_version=26.3.0.0
